name: Build Flutter APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files & Dependencies
        run: |
          cd flutter_cuti_karyawan
          flutter create --platforms=android,web,ios .
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd flutter_cuti_karyawan
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cuti-Karyawan-Release-APK
          path: flutter_cuti_karyawan/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
