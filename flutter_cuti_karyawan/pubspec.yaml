name: flutter_cuti_karyawan
description: "Aplikasi Manajemen Cuti Karyawan PT. Nakakin Indonesia (Android, iOS & Web)"
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  file_picker: ^8.1.4
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/Icon_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/images/Icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/